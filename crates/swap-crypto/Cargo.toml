[package]
name = "shielded-swap-crypto"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
reddsa_frost = { package = "reddsa", git = "https://github.com/ZcashFoundation/reddsa.git", rev = "ed49e9ca0699a6450f6d4a9fe62ff168f5ea1ead", features = ["frost"] }
reddsa = "=0.6.1"
frost-core = { version = "=2.2.0", features = ["internals"] }
ff = "=0.13.1"
group = "=0.13.0"
pasta_curves = "=0.5.2"
rand_core = { version = "=0.6.4", features = ["getrandom"] }
hex = "=0.4.3"
serde_json = "=1.0.149"
